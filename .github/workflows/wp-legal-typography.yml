name: Legal Pages Typography

on:
  workflow_dispatch:
  push:
    branches: [claude/general-session-Bv0AI]
    paths:
      - 'scripts/wp-legal-typography.js'
      - '.github/workflows/wp-legal-typography.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/general-session-Bv0AI
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y && npm install puppeteer
      - run: node scripts/wp-legal-typography.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          git reset HEAD package.json package-lock.json node_modules 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; else
            git commit -m "Legal pages typography measurement"
            git push
          fi
