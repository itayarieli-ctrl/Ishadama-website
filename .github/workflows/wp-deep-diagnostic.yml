name: WP Deep Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/general-session-Bv0AI
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deep diagnostic
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/wp-deep-diagnostic.js
      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if git diff --staged --quiet; then
            echo "No new findings"
          else
            git commit -m "Deep diagnostic: $(date -u +%Y-%m-%d)"
            git push
          fi
