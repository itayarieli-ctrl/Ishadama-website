name: Mobile Overflow Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [claude/general-session-Bv0AI]
    paths:
      - 'scripts/wp-mobile-overflow.js'
      - '.github/workflows/wp-mobile-overflow.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/general-session-Bv0AI
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run mobile overflow diagnostic
        run: node scripts/wp-mobile-overflow.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Mobile overflow diagnostic: $(date -u +%Y-%m-%d)"
            git push
          fi
