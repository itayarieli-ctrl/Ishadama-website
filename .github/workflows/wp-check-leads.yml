name: Check Stored Leads

on:
  workflow_dispatch:
  push:
    branches: [claude/general-session-Bv0AI]
    paths:
      - 'scripts/wp-check-leads.js'
      - '.github/workflows/wp-check-leads.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/general-session-Bv0AI
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for stored leads
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/wp-check-leads.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Stored leads check: $(date -u +%Y-%m-%d)"
            git push
          fi
